    <ellipse cx="855" cy="169" rx="75" ry="56" fill="#2100FA" opacity=".11"/>
    <path d="M810 145q5-18 27-18h36q23 0 30 18l17 38q7 18-7 23q-10 4-21-6l-17-15h-43l-18 15q-11 11-21 5q-13-8-6-25Z" fill="#233854" stroke="#86C5FF" stroke-width="3.4" stroke-linejoin="round"/>
    <path d="M819 157h32m-16-16v32" stroke="#8BD7FF" stroke-width="6" stroke-linecap="round"/>
    <circle cx="879" cy="148" r="6" fill="#A39BFF"/>
    <circle cx="891" cy="161" r="6" fill="#5DBBFF"/>
    <circle cx="867" cy="161" r="5" fill="#4E75F8"/>
    <path d="M848 181h8m11 0h8" stroke="#B3C9F6" stroke-width="3" stroke-linecap="round"/>
    <path d="M812 198q3 6 9 6m80-6q4 5 9 4" stroke="#C4DDFD" stroke-opacity=".5" stroke-width="2" fill="none" stroke-linecap="round"/>
